version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./store:/app/store
    environment:
      - LLM_PROVIDER=ollama
      - LLM_MODEL=qwen2.5:7b-instruct
      - OLLAMA_HOST=http://host.docker.internal:11434
      - EMBED_MODEL=BAAI/bge-small-en-v1.5
      - CHUNK_TARGET_TOKENS=350
      - RETRIEVAL_MODE=hybrid
      - TOP_K=5
      - STORE_DIR=/app/store
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama:
